[build]
  # base = "" neutralizes any stray "Base directory" set in the Netlify UI.
  base = ""
  command = "npm run build"
  # TanStack Start + Nitro "netlify" preset emits client assets to dist/
  # and the SSR server function to .netlify/functions-internal/ (auto-packaged).
  publish = "dist"

[build.environment]
  # VITE_-prefixed vars are inlined into the client bundle by design, and the
  # Supabase anon key + URL are meant to be public (RLS enforces access control).
  # Tell Netlify's secret scanner not to treat them as leaked secrets.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# NOTE: no [[redirects]] catch-all. This is an SSR app — the Nitro netlify
# preset wires request routing to the server function automatically. A manual
# /* -> /index.html rule would shadow SSR and serve a non-existent static shell.

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.production]
  environment = { ENVIRONMENT = "production" }

[context.deploy-preview]
  environment = { ENVIRONMENT = "preview" }

[context.branch-deploy]
  environment = { ENVIRONMENT = "staging" }
